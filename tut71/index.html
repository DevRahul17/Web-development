<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inserting and Removing Elements</title>
</head>

<body>
    <div class="container">
        <div class="box">Hey i am a box</div>
    </div>
    <script>
         let div = document.createElement("div");
         div.setAttribute("class")
    </script>
</body>

</html>
