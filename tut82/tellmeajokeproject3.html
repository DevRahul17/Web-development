<!-- // Exercise 3 - Tell me a Joke
// innerHTML is used to populate an HTML element, such as a <div>, with HTML content. Search online to learn about the innerHTML property and how it works. 

// Create a website that displays a random joke whenever a button is clicked.

// Requirements:

// Create an array containing several jokes. You can search the internet for jokes and use them to create your array.
// Use Math.random() to randomly select a joke from the array.
// Use innerHTML to display the selected joke inside a <div>.
// Add a button such as "Get New Joke".
// Every time the user clicks the button, a new random joke should be displayed.
// You may use HTML, CSS, and JavaScript to create the website. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tell me a Joke</title>
    <style>
        body{
            background-color: aqua;
            text-align: center;
            align-items: center;
        }

        h1{
            color: blue;
            font-size: larger;
            font-weight: bolder;
        }

        div {
            color: rgb(58, 17, 162);
        }

        button {
            color: rgb(241, 10, 72);
            background-color: rgb(145, 228, 205);
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>😂 Tell me a Joke</h1>
    <div id="joke">Click on the button to get a Joke!</div>
    <button onclick="getjoke()">Get New Joke</button>

    <script>
        let jokes = [
            "Why did the computer go to the doctor? Because it had a virus!",
            "Why do programmers prefer dark mode? Because light attracts bugs!",
            "Why was the JavaScript developer sad? Because he didn't know how to null his feelings.",
            "Why did the bicycle fall over? Because it was two-tired!",
            "What do you call a fake noodle? An impasta!"
        ];

        function getjoke(){
            let randomindex = Math.floor(Math.random() * jokes.length);

            let randomjoke = jokes[randomindex];

            document.getElementById("joke").innerHTML = randomjoke;
        }
    </script>
</body>

</html>
