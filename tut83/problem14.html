<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smooth Scroll to Top</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #333;
    }

    header {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      color: white;
      text-align: center;
    }

    header h1 {
      font-size: 50px;
      margin-bottom: 15px;
    }

    header p {
      font-size: 20px;
    }

    main {
      padding: 60px 10%;
    }

    section {
      padding: 50px;
      margin-bottom: 40px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
    }

    .large-content {
      min-height: 100vh;
    }

    /* Scroll to Top Button */
    #scrollTopBtn {
      position: fixed;
      right: 25px;
      bottom: 25px;

      padding: 12px 18px;
      border: none;
      border-radius: 50px;

      background: #007bff;
      color: white;
      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);

      transition: 0.3s ease;
    }

    #scrollTopBtn:hover {
      background: #0056b3;
      transform: translateY(-3px);
    }
  </style>
</head>

<body>

  <header>
    <h1>My Website</h1>
    <p>Scroll down to see the button.</p>
  </header>

  <main>
    <section>
      <h2>Content Section</h2>
      <p>
        This is some example content. Keep scrolling down to test
        the smooth scroll effect.
      </p>
    </section>

    <section class="large-content">
      <h2>More Content</h2>
      <p>
        Add your website content here. The page is intentionally tall
        so you can scroll and test the button.
      </p>
    </section>
  </main>

  <button id="scrollTopBtn" onclick="smoothScrollToTop()">
    ↑ Top
  </button>

  <script>
    function smoothScrollToTop() {
      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }
  </script>

</body>

</html>
