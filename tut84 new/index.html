<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">

    <title>Spotify</title>

</head>

<body>
    <div class="container flex bgblack">

        <!-- Left Sidebar -->
        <div class="left">

            <div class="home bggrey rounded margin1">
                <div class="logo">
                    <img class="invert" src="logo.svg" alt="Spotify Logo">
                </div>

                <ul>
                    <li>
                        <img class="invert" src="home.svg" alt="Home">
                        Home
                    </li>

                    <li>
                        <img class="invert" src="search.svg" alt="Search">
                        Search
                    </li>
                </ul>
            </div>

            <!-- Library -->
            <div class="library bggrey rounded margin1 p1">

                <div class="heading">
                    <img class="invert" src="playlist.svg" alt="Playlist">
                    <h4>Your Library</h4>
                </div>

                <div class="footer">
                    <div>
                        <a href="https://www.spotify.com/jp/legal/">
                            <span>Legal</span>
                        </a>
                    </div>

                    <div>
                        <a href="https://www.spotify.com/jp/privacy/">
                            <span>Privacy Center</span>
                        </a>
                    </div>

                    <div>
                        <a href="https://www.spotify.com/jp/legal/privacy-policy/">
                            <span>Privacy Policy</span>
                        </a>
                    </div>

                    <div>
                        <a href="https://www.spotify.com/jp/legal/cookies-policy/">
                            <span>Cookies</span>
                        </a>
                    </div>

                    <div>
                        <a href="https://www.spotify.com/jp/legal/privacy-policy/#s3">
                            <span>About Ads</span>
                        </a>
                    </div>

                    <div>
                        <a href="https://www.spotify.com/jp/accessibility/">
                            <span>Accessibility</span>
                        </a>
                    </div>
                </div>

            </div>
        </div>

        <!-- Right Content -->
        <div class="right bggrey rounded">

            <!-- Header -->
            <div class="header">

                <div class="nav">
                    <!-- <div class="hamburgerContainer"> -->

                    <!-- <img width="40" class="invert hamburger" src="img/hamburger.svg" alt="Menu"> -->

                    <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M15 6L9.70711 11.2929C9.37377 11.6262 9.20711 11.7929 9.20711 12C9.20711 12.2071 9.37377 12.3738 9.70711 12.7071L15 18"
                            stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>

                    <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M9 18L14.2929 12.7071C14.6262 12.3738 14.7929 12.2071 14.7929 12C14.7929 11.7929 14.6262 11.6262 14.2929 11.2929L9 6"
                            stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>

                    <!-- </div> -->
                </div>

                <div class="buttons">
                    <button class="signupbtn">Sign up</button>
                    <button class="loginbtn">Log in</button>
                </div>

            </div>

            <div class="spotifyplaylists">
                <h3>Spotify Playlists</h3>
                <div class="cardcontainer">
                    <div class="card">
                        <div class="play">
                            <svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">

                                <circle cx="20" cy="20" r="20" fill="#1ED760" />

                                <path d="M16 12.5L30 20L16 27.5V12.5Z" fill="#000" />
                            </svg>

                        </div>
                        <img src="card1.jpg" alt="">
                        <h3>Radhimaa - From "Think Indie"</h3>
                        <p>Sai Abhyankkar, Nargis Teji,Asma teji, Vivek</p>
                    </div>

                    <div class="card">
                        <img src="card1.jpg" alt="">
                        <h3></h3>
                        <p></p>
                    </div>

                </div>
                <div class="playbar">
                    <div class="songinfo">

                    </div>
                    <div class="songbuttons">
                        <img src="prevsong.svg" alt="">
                        <img src="play.svg" alt="">
                        <img src="nextsong.svg" alt="">
                    </div>
                    <div class="songtime">

                    </div>
                </div>
            </div>
        </div>

    </div>
    <script src="script.js">

    </script>
</body>

</html>
