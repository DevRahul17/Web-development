<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Digital Profile Card</title>
</head>

<body
    style="margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #74b9ff, #a29bfe); display: flex; justify-content: center; align-items: center; min-height: 100vh;">

    <!-- Main Profile Card Container -->
    <div
        style="background-color: #ffffff; width: 350px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.15); text-align: center;">

        <!-- Profile Picture Placeholder -->
        <div
            style="width: 110px; height: 110px; background-color: #ffeaa7; border-radius: 50%; margin: 0 auto 15px auto; display: flex; justify-content: center; align-items: center; border: 4px solid #ffffff; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
            <span style="font-size: 40px;">🚀</span>
        </div>

        <!-- User Information -->
        <h1 style="font-size: 24px; color: #2d3436; margin: 10px 0 5px 0;">Devrahul17</h1>
        <p
            style="font-size: 14px; color: #636e72; margin: 0 0 20px 0; font-weight: 500; text-transform: uppercase; letter-spacing: 1px;">
            Web Designer & Creator</p>

        <!-- Short Bio -->
        <p style="font-size: 15px; color: #2d3436; line-height: 1.6; margin: 0 0 25px 0;">
            I build clean, beautiful websites using just HTML and CSS. Welcome to my mini bio page!
        </p>

        <!-- Social & Project Links -->
        <div style="display: flex; flex-direction: column; gap: 12px;">

            <a href="#"
                style="display: block; background-color: #6c5ce7; color: #ffffff; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: bold; transition: 0.3s; box-shadow: 0 4px 6px rgba(108, 92, 231, 0.2);">
                View My Portfolio
            </a>

            <a href="#"
                style="display: block; background-color: #0984e3; color: #ffffff; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: bold; transition: 0.3s; box-shadow: 0 4px 6px rgba(9, 132, 227, 0.2);">
                Connect on LinkedIn
            </a>

            <a href="#"
                style="display: block; background-color: #2d3436; color: #ffffff; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: bold; transition: 0.3s; box-shadow: 0 4px 6px rgba(45, 52, 54, 0.2);">
                Follow on GitHub
            </a>

        </div>

        <!-- Footer Note -->
        <div style="margin-top: 25px; border-top: 1px solid #eee; padding-top: 15px;">
            <p style="font-size: 12px; color: #b2bec3; margin: 0;">Created with Inline CSS 💻</p>
        </div>

    </div>

</body>

</html>
