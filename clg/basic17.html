<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline CSS Project</title>
</head>
<body style="margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #74ebe1 0%, #d4a5ec 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh;">

    <!-- Main Card Container -->
    <div style="background-color: #ffffff; width: 360px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15); padding: 24px; text-align: center; transition: transform 0.3s ease;">
        
        <!-- Product Badge -->
        <span style="background-color: #e3f2fd; color: #0d47a1; font-size: 12px; font-weight: bold; text-transform: uppercase; padding: 6px 12px; border-radius: 20px; display: inline-block; margin-bottom: 16px;">
            New Release
        </span>

        <!-- Product Image Placeholder -->
        <div style="width: 100%; height: 200px; background-color: #f5f5f5; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;">
            <svg style="width: 64px; height: 64px; fill: #bdbdbd;" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.04-.42 1.99-1.07 2.75z"/>
            </svg>
        </div>

        <!-- Product Title -->
        <h1 style="color: #212121; font-size: 24px; margin: 0 0 10px 0; font-weight: 700;">
            Aura Wireless Pods
        </h1>

        <!-- Product Description -->
        <p style="color: #616161; font-size: 14px; line-height: 1.6; margin: 0 0 24px 0;">
            Experience pure sound clarity with immersive active noise cancellation and a seamless 30-hour battery life.
        </p>

        <!-- Pricing Section -->
        <div style="display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 24px;">
            <span style="font-size: 24px; font-weight: bold; color: #e91e63;">$129.00</span>
            <span style="font-size: 16px; color: #9e9e9e; text-decoration: line-through;">$179.00</span>
        </div>

        <!-- Call to Action Button -->
        <button style="width: 100%; background-color: #6200ee; color: #ffffff; border: none; padding: 14px; font-size: 16px; font-weight: 600; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 12px rgba(98, 0, 238, 0.3); outline: none;">
            Buy Now
        </button>
        
    </div>

</body>
</html>
