
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus Timer | Stay Productive</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #203b35, #10151d 65%);
    color: white;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 440px;
    text-align: center;
    padding: 35px 25px;
    border: 1px solid #ffffff20;
    border-radius: 28px;
    background: #ffffff09;
    box-shadow: 0 20px 60px #0005;
    backdrop-filter: blur(15px);
}

.logo {
    font-size: 38px;
    margin-bottom: 12px;
}

h1 {
    font-size: 28px;
    margin-bottom: 8px;
}

.subtitle {
    color: #aab9b5;
    margin-bottom: 28px;
    font-size: 14px;
}

.modes {
    display: flex;
    gap: 8px;
    margin-bottom: 30px;
}

.modes button {
    flex: 1;
    padding: 11px 5px;
    border: none;
    border-radius: 10px;
    background: #ffffff10;
    color: #d6e0dc;
    cursor: pointer;
    font-size: 12px;
    transition: 0.3s;
}

.modes button.active {
    background: #32d69a;
    color: #10251d;
    font-weight: bold;
}

.timer-ring {
    width: 245px;
    height: 245px;
    border-radius: 50%;
    margin: 0 auto 28px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: conic-gradient(
        #32d69a var(--progress, 100%),
        #ffffff15 0
    );
    position: relative;
    transition: background 0.3s;
}

.timer-ring::before {
    content: "";
    position: absolute;
    inset: 10px;
    background: #17231f;
    border-radius: 50%;
}

.timer-content {
    position: relative;
    z-index: 1;
}

#timer {
    font-size: 55px;
    font-weight: bold;
    letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
}

#status {
    margin-top: 10px;
    font-size: 13px;
    color: #32d69a;
    letter-spacing: 2px;
}

.controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 28px;
}

.controls button {
    border: none;
    padding: 14px 24px;
    border-radius: 12px;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s;
}

.controls button:hover {
    transform: translateY(-2px);
    filter: brightness(1.1);
}

#startBtn {
    background: #32d69a;
    color: #10251d;
    font-weight: bold;
    min-width: 135px;
}

#resetBtn {
    background: #ffffff15;
    color: white;
}

.stats {
    display: flex;
    gap: 12px;
}

.stat {
    flex: 1;
    padding: 15px 5px;
    background: #ffffff09;
    border-radius: 14px;
}

.stat h2 {
    font-size: 23px;
    margin-bottom: 6px;
}

.stat p {
    color: #aab9b5;
    font-size: 12px;
}

footer {
    margin-top: 25px;
    color: #82948d;
    font-size: 12px;
}

@media (max-width: 380px) {
    .timer-ring {
        width: 215px;
        height: 215px;
    }

    #timer {
        font-size: 45px;
    }

    .controls button {
        padding: 12px 17px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">⏱️</div>
    <h1>Focus Timer</h1>
    <p class="subtitle">Focus on what matters. One session at a time.</p>

    <div class="modes">
        <button class="active" data-minutes="25">Focus</button>
        <button data-minutes="5">Short Break</button>
        <button data-minutes="15">Long Break</button>
    </div>

    <div class="timer-ring" id="timerRing">
        <div class="timer-content">
            <div id="timer">25:00</div>
            <div id="status">READY TO FOCUS</div>
        </div>
    </div>

    <div class="controls">
        <button id="startBtn">▶ Start</button>
        <button id="resetBtn">↻ Reset</button>
    </div>

    <div class="stats">
        <div class="stat">
            <h2 id="sessions">0</h2>
            <p>Sessions</p>
        </div>

        <div class="stat">
            <h2 id="minutes">0</h2>
            <p>Minutes Focused</p>
        </div>
    </div>

    <footer>💚 Stay consistent. Great things take focus.</footer>

</div>

<script>
const timerDisplay = document.getElementById("timer");
const statusDisplay = document.getElementById("status");
const startBtn = document.getElementById("startBtn");
const resetBtn = document.getElementById("resetBtn");
const timerRing = document.getElementById("timerRing");
const modeButtons = document.querySelectorAll(".modes button");

let selectedMinutes = 25;
let remainingSeconds = selectedMinutes * 60;
let totalSeconds = remainingSeconds;
let interval = null;
let isRunning = false;
let sessions = 0;
let focusedMinutes = 0;

function updateDisplay() {
    const minutes = Math.floor(remainingSeconds / 60);
    const seconds = remainingSeconds % 60;

    timerDisplay.textContent =
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");

    const progress = totalSeconds > 0
        ? (remainingSeconds / totalSeconds) * 100
        : 0;

    timerRing.style.setProperty("--progress", progress + "%");

    document.title = timerDisplay.textContent + " - Focus Timer";
}

function stopTimer() {
    clearInterval(interval);
    interval = null;
    isRunning = false;
    startBtn.textContent = "▶ Start";
}

function startTimer() {
    if (isRunning) return;

    if (remainingSeconds <= 0) {
        remainingSeconds = totalSeconds;
        updateDisplay();
    }

    isRunning = true;
    startBtn.textContent = "❚❚ Pause";
    statusDisplay.textContent = "TIME TO FOCUS";

    interval = setInterval(() => {
        remainingSeconds--;
        updateDisplay();

        if (remainingSeconds <= 0) {
            stopTimer();
            statusDisplay.textContent = "SESSION COMPLETE!";

            if (selectedMinutes === 25) {
                sessions++;
                focusedMinutes += selectedMinutes;
                document.getElementById("sessions").textContent = sessions;
                document.getElementById("minutes").textContent = focusedMinutes;
            }

            startBtn.textContent = "▶ Start";
            alert("🎉 Timer completed! Great work. Take a break!");
        }
    }, 1000);
}

function pauseTimer() {
    stopTimer();
    statusDisplay.textContent = "PAUSED";
}

function resetTimer() {
    stopTimer();
    remainingSeconds = totalSeconds;
    statusDisplay.textContent = "READY TO FOCUS";
    updateDisplay();
}

startBtn.addEventListener("click", () => {
    if (isRunning) {
        pauseTimer();
    } else {
        startTimer();
    }
});

resetBtn.addEventListener("click", resetTimer);

modeButtons.forEach(button => {
    button.addEventListener("click", () => {
        stopTimer();

        modeButtons.forEach(btn => btn.classList.remove("active"));
        button.classList.add("active");

        selectedMinutes = Number(button.dataset.minutes);
        remainingSeconds = selectedMinutes * 60;
        totalSeconds = remainingSeconds;

        statusDisplay.textContent =
            selectedMinutes === 25 ? "READY TO FOCUS" : "TIME TO RELAX";

        updateDisplay();
    });
});

updateDisplay();
</script>

</body>
</html>
