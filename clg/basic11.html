<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML and CSS Profile Card</title>
    <style>
        /* CSS Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Card Container Styling */
        .card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 350px;
            padding: 30px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* Profile Image Placeholder */
        .profile-img {
            width: 100px;
            height: 100px;
            background-color: #007bff;
            border-radius: 50%;
            margin: 0 auto 20px;
        }

        /* Typography Styling */
        h1 {
            font-size: 24px;
            color: #333333;
            margin-bottom: 8px;
        }

        p {
            font-size: 14px;
            color: #666666;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        /* Button Styling */
        .btn {
            display: inline-block;
            background-color: #007bff;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <!-- HTML Structure -->
    <div class="card">
        <div class="profile-img"></div>
        <h1>Jane Doe</h1>
        <p>Frontend Developer & UI Designer. Passionate about creating clean, modern, and user-friendly web experiences.
        </p>
        <a href="#" class="btn">Connect</a>
    </div>

</body>

</html>
