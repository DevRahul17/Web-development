<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login & Signup Form</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #0f172a, #312e81, #581c87);
    padding: 20px;
    color: white;
}

.container {
    width: 100%;
    max-width: 420px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 20px;
    padding: 35px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    animation: appear 0.6s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(25px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.logo {
    text-align: center;
    font-size: 32px;
    margin-bottom: 10px;
}

h2 {
    text-align: center;
    margin-bottom: 10px;
    font-size: 28px;
}

.subtitle {
    text-align: center;
    color: #cbd5e1;
    margin-bottom: 25px;
    font-size: 14px;
}

.tabs {
    display: flex;
    background: rgba(0,0,0,0.2);
    padding: 5px;
    border-radius: 10px;
    margin-bottom: 25px;
}

.tabs button {
    width: 50%;
    padding: 11px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: #cbd5e1;
    font-size: 15px;
    cursor: pointer;
    transition: 0.3s;
}

.tabs button.active {
    background: #818cf8;
    color: white;
}

.form-group {
    margin-bottom: 18px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    color: #e2e8f0;
}

.input-box {
    position: relative;
}

input {
    width: 100%;
    padding: 13px 45px 13px 14px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    outline: none;
    background: rgba(255,255,255,0.07);
    color: white;
    font-size: 14px;
    transition: 0.3s;
}

input::placeholder {
    color: #94a3b8;
}

input:focus {
    border-color: #818cf8;
    box-shadow: 0 0 0 3px rgba(129,140,248,0.15);
}

.toggle-password {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 13px;
    color: #c4b5fd;
    user-select: none;
}

.options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    margin: 5px 0 20px;
    color: #cbd5e1;
}

.remember {
    display: flex;
    align-items: center;
    gap: 6px;
}

.remember input {
    width: auto;
    accent-color: #818cf8;
}

a {
    color: #c4b5fd;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

.submit-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #6366f1, #a855f7);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(129,140,248,0.3);
}

.message {
    margin-top: 16px;
    text-align: center;
    font-size: 13px;
    line-height: 1.5;
    display: none;
}

.message.success {
    color: #86efac;
}

.message.error {
    color: #fca5a5;
}

.footer {
    text-align: center;
    font-size: 12px;
    color: #94a3b8;
    margin-top: 25px;
}

.hidden {
    display: none;
}

@media (max-width: 480px) {
    .container {
        padding: 25px 20px;
    }

    h2 {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">🔐</div>
    <h2 id="heading">Welcome Back!</h2>
    <p class="subtitle" id="subtitle">
        Login to continue to your account
    </p>

    <div class="tabs">
        <button id="loginTab" class="active"
            type="button" onclick="switchForm('login')">
            Login
        </button>

        <button id="signupTab"
            type="button" onclick="switchForm('signup')">
            Sign Up
        </button>
    </div>

    <form id="loginForm">

        <div class="form-group">
            <label for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail"
                placeholder="you@example.com" required>
        </div>

        <div class="form-group">
            <label for="loginPassword">Password</label>
            <div class="input-box">
                <input type="password" id="loginPassword"
                    placeholder="Enter your password"
                    minlength="8" required>
                <span class="toggle-password"
                    onclick="togglePassword('loginPassword', this)">
                    Show
                </span>
            </div>
        </div>

        <div class="options">
            <label class="remember">
                <input type="checkbox" id="rememberMe">
                Remember me
            </label>

            <a href="#" onclick="forgotPassword(event)">
                Forgot password?
            </a>
        </div>

        <button class="submit-btn" type="submit">
            Login Now →
        </button>
    </form>

    <form id="signupForm" class="hidden">

        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName"
                placeholder="Enter your full name"
                minlength="2" required>
        </div>

        <div class="form-group">
            <label for="signupEmail">Email Address</label>
            <input type="email" id="signupEmail"
                placeholder="you@example.com" required>
        </div>

        <div class="form-group">
            <label for="signupPassword">Password</label>
            <div class="input-box">
                <input type="password" id="signupPassword"
                    placeholder="Minimum 8 characters"
                    minlength="8" required>
                <span class="toggle-password"
                    onclick="togglePassword('signupPassword', this)">
                    Show
                </span>
            </div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <div class="input-box">
                <input type="password" id="confirmPassword"
                    placeholder="Re-enter your password"
                    minlength="8" required>
                <span class="toggle-password"
                    onclick="togglePassword('confirmPassword', this)">
                    Show
                </span>
            </div>
        </div>

        <div class="options">
            <label class="remember">
                <input type="checkbox" id="terms" required>
                I agree to the <a href="#"
                    onclick="showTerms(event)">Terms</a>
            </label>
        </div>

        <button class="submit-btn" type="submit">
            Create Account →
        </button>
    </form>

    <p id="message" class="message" role="status"
        aria-live="polite"></p>

    <div class="footer">
        © 2026 SecureAuth · Your journey starts here
    </div>

</div>

<script>
const loginForm = document.getElementById("loginForm");
const signupForm = document.getElementById("signupForm");
const message = document.getElementById("message");

function switchForm(type) {
    message.style.display = "none";
    message.textContent = "";

    const isLogin = type === "login";

    loginForm.classList.toggle("hidden", !isLogin);
    signupForm.classList.toggle("hidden", isLogin);

    document.getElementById("loginTab")
        .classList.toggle("active", isLogin);

    document.getElementById("signupTab")
        .classList.toggle("active", !isLogin);

    document.getElementById("heading").textContent =
        isLogin ? "Welcome Back!" : "Create Account";

    document.getElementById("subtitle").textContent =
        isLogin
        ? "Login to continue to your account"
        : "Sign up to get started today";
}

function togglePassword(id, element) {
    const input = document.getElementById(id);

    if (input.type === "password") {
        input.type = "text";
        element.textContent = "Hide";
    } else {
        input.type = "password";
        element.textContent = "Show";
    }
}

function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
    message.style.display = "block";
}

signupForm.addEventListener("submit", function(event) {
    event.preventDefault();

    const name = document.getElementById("fullName")
        .value.trim();

    const email = document.getElementById("signupEmail")
        .value.trim();

    const password = document.getElementById("signupPassword")
        .value;

    const confirm = document.getElementById("confirmPassword")
        .value;

    if (name.length < 2) {
        showMessage("Please enter your full name.", "error");
        return;
    }

    if (password.length < 8) {
        showMessage("Password must be at least 8 characters.", "error");
        return;
    }

    if (password !== confirm) {
        showMessage("Passwords do not match!", "error");
        return;
    }

    if (!document.getElementById("terms").checked) {
        showMessage("Please accept the Terms to continue.", "error");
        return;
    }

    showMessage(
        "Account form validated successfully! Connect a backend to create your account.",
        "success"
    );
});

loginForm.addEventListener("submit", function(event) {
    event.preventDefault();

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    if (!email || !password) {
        showMessage("Please fill in all fields.", "error");
        return;
    }

    showMessage(
        "Form validated! Connect a backend to authenticate your login.",
        "success"
    );
});

function forgotPassword(event) {
    event.preventDefault();

    showMessage(
        "Password reset requires a backend or email service.",
        "error"
    );
}

function showTerms(event) {
    event.preventDefault();

    showMessage(
        "Add your Terms and Conditions before publishing this app.",
        "error"
    );
}
</script>

</body>
</html>
