<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Movie Search App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0f172a;
            color: white;
        }

        /* Header */
        header {
            padding: 30px 20px;
            text-align: center;
            background: #111827;
        }

        header h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        header p {
            color: #94a3b8;
        }

        /* Search */
        .search-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 30px auto;
            max-width: 650px;
            padding: 0 20px;
        }

        .search-box input {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            outline: none;
            font-size: 16px;
        }

        .search-box button {
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #e11d48;
            color: white;
            font-weight: bold;
            transition: 0.3s;
        }

        .search-box button:hover {
            transform: translateY(-2px);
            background: #be123c;
        }

        /* Status */
        #status {
            text-align: center;
            margin: 20px;
            color: #94a3b8;
        }

        /* Movie Grid */
        .movie-container {
            width: 90%;
            max-width: 1200px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 25px;
            padding-bottom: 50px;
        }

        /* Movie Card */
        .movie-card {
            background: #1e293b;
            border-radius: 15px;
            overflow: hidden;
            transition: 0.3s;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .movie-card:hover {
            transform: translateY(-8px);
        }

        .movie-card img {
            width: 100%;
            height: 310px;
            object-fit: cover;
        }

        .movie-info {
            padding: 15px;
        }

        .movie-info h3 {
            margin-bottom: 8px;
            font-size: 18px;
        }

        .movie-info p {
            color: #94a3b8;
            margin: 5px 0;
        }

        .rating {
            color: #facc15 !important;
            font-weight: bold;
        }

        /* Modal */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 10;
        }

        .modal-content {
            background: #1e293b;
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 18px;
            padding: 25px;
            position: relative;
        }

        .close {
            position: absolute;
            right: 20px;
            top: 15px;
            font-size: 30px;
            cursor: pointer;
            color: white;
        }

        .details {
            display: flex;
            gap: 25px;
            margin-top: 20px;
        }

        .details img {
            width: 220px;
            border-radius: 12px;
        }

        .details-info {
            flex: 1;
        }

        .details-info h2 {
            margin-bottom: 15px;
            font-size: 28px;
        }

        .details-info p {
            margin: 10px 0;
            line-height: 1.6;
            color: #cbd5e1;
        }

        /* Responsive */
        @media (max-width: 600px) {
            header h1 {
                font-size: 28px;
            }

            .search-box {
                flex-direction: column;
            }

            .details {
                flex-direction: column;
                align-items: center;
            }

            .details img {
                width: 180px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🎬 Movie Search</h1>
        <p>Search for your favorite movies and explore their details</p>
    </header>

    <div class="search-box">
        <input
            type="text"
            id="searchInput"
            placeholder="Search movie...">
        <button onclick="searchMovies()">Search</button>
    </div>

    <div id="status">Search for a movie to get started 🍿</div>

    <div class="movie-container" id="movieContainer"></div>

    <!-- Movie Details Modal -->
    <div class="modal" id="movieModal">

        <div class="modal-content">

            <span class="close" onclick="closeModal()">&times;</span>

            <div class="details" id="movieDetails"></div>

        </div>

    </div>


    <script>

        // ==========================================
        // 1. API CONFIGURATION
        // ==========================================

        const API_KEY = "YOUR_API_KEY";

        const movieContainer =
            document.getElementById("movieContainer");

        const searchInput =
            document.getElementById("searchInput");

        const status =
            document.getElementById("status");

        const modal =
            document.getElementById("movieModal");

        const movieDetails =
            document.getElementById("movieDetails");


        // ==========================================
        // 2. SEARCH MOVIES
        // ==========================================

        async function searchMovies() {

            const movieName = searchInput.value.trim();

            if (movieName === "") {

                status.textContent =
                    "⚠️ Please enter a movie name.";

                return;
            }

            status.textContent = "🔎 Searching...";

            movieContainer.innerHTML = "";

            try {

                const url =
                    `https://www.omdbapi.com/?apikey=${API_KEY}&s=${encodeURIComponent(movieName)}`;

                const response = await fetch(url);

                const data = await response.json();

                if (data.Response === "False") {

                    status.textContent =
                        "❌ Movie not found.";

                    return;
                }

                status.textContent =
                    `🎬 Found ${data.Search.length} results`;

                displayMovies(data.Search);

            }

            catch (error) {

                console.error(error);

                status.textContent =
                    "❌ Something went wrong. Check your internet connection.";

            }
        }


        // ==========================================
        // 3. DISPLAY MOVIES
        // ==========================================

        function displayMovies(movies) {

            movieContainer.innerHTML = "";

            movies.forEach(movie => {

                const poster =
                    movie.Poster !== "N/A"
                    ? movie.Poster
                    : "https://via.placeholder.com/300x450?text=No+Poster";

                const card =
                    document.createElement("div");

                card.className = "movie-card";

                card.innerHTML = `

                    <img
                        src="${poster}"
                        alt="${movie.Title}">

                    <div class="movie-info">

                        <h3>${movie.Title}</h3>

                        <p>📅 ${movie.Year}</p>

                        <p>🎥 ${movie.Type}</p>

                        <p class="rating">
                            ⭐ Click for details
                        </p>

                    </div>

                `;

                card.addEventListener(
                    "click",
                    () => getMovieDetails(movie.imdbID)
                );

                movieContainer.appendChild(card);

            });
        }


        // ==========================================
        // 4. GET MOVIE DETAILS
        // ==========================================

        async function getMovieDetails(imdbID) {

            try {

                const url =
                    `https://www.omdbapi.com/?apikey=${API_KEY}&i=${imdbID}&plot=full`;

                const response =
                    await fetch(url);

                const movie =
                    await response.json();

                if (movie.Response === "False") {

                    alert("Movie details not found.");

                    return;
                }

                const poster =
                    movie.Poster !== "N/A"
                    ? movie.Poster
                    : "https://via.placeholder.com/300x450?text=No+Poster";


                movieDetails.innerHTML = `

                    <img
                        src="${poster}"
                        alt="${movie.Title}">

                    <div class="details-info">

                        <h2>${movie.Title}</h2>

                        <p>
                            ⭐ <strong>IMDb:</strong>
                            ${movie.imdbRating}
                        </p>

                        <p>
                            📅 <strong>Year:</strong>
                            ${movie.Year}
                        </p>

                        <p>
                            🎭 <strong>Genre:</strong>
                            ${movie.Genre}
                        </p>

                        <p>
                            🎬 <strong>Director:</strong>
                            ${movie.Director}
                        </p>

                        <p>
                            👨‍🎤 <strong>Actors:</strong>
                            ${movie.Actors}
                        </p>

                        <p>
                            ⏱️ <strong>Runtime:</strong>
                            ${movie.Runtime}
                        </p>

                        <p>
                            🌍 <strong>Country:</strong>
                            ${movie.Country}
                        </p>

                        <p>
                            📝 <strong>Plot:</strong>
                            ${movie.Plot}
                        </p>

                    </div>

                `;

                modal.style.display = "flex";

            }

            catch (error) {

                console.error(error);

                alert("Unable to load movie details.");

            }
        }


        // ==========================================
        // 5. CLOSE MODAL
        // ==========================================

        function closeModal() {

            modal.style.display = "none";

        }


        // ==========================================
        // 6. CLOSE MODAL WHEN CLICKING OUTSIDE
        // ==========================================

        window.addEventListener("click", function(event) {

            if (event.target === modal) {

                closeModal();

            }

        });


        // ==========================================
        // 7. SEARCH USING ENTER KEY
        // ==========================================

        searchInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    searchMovies();

                }

            }
        );

    </script>

</body>
</html>
