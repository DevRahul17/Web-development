
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile Card</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .card {
            width: 320px;
            padding: 30px;
            text-align: center;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
        }

        .avatar {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00dbde, #fc00ff);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: bold;
        }

        h2 {
            margin-bottom: 10px;
        }

        p {
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .skills {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 25px;
        }

        .skills span {
            background: #334155;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        button {
            background: #00dbde;
            color: #102030;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #fc00ff;
            color: white;
            transform: scale(1.05);
        }

        #message {
            margin-top: 15px;
            color: #67e8f9;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="avatar">RK</div>

        <h2>Rahul Kumar</h2>
        <p>Aspiring Software Developer 🚀</p>

        <div class="skills">
            <span>HTML</span>
            <span>CSS</span>
            <span>JavaScript</span>
            <span>Java</span>
        </div>

        <button id="followBtn">Follow Me</button>
        <div id="message"></div>
    </div>

    <script>
        const button = document.getElementById("followBtn");
        const message = document.getElementById("message");

        let isFollowing = false;

        button.addEventListener("click", function () {
            isFollowing = !isFollowing;

            if (isFollowing) {
                button.textContent = "Following ✓";
                message.textContent = "Thanks for following! 🎉";
            } else {
                button.textContent = "Follow Me";
                message.textContent = "";
            }
        });
    </script>

</body>
</html>
