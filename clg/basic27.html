```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat Interface</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #212121;
    color: #ececec;
    height: 100vh;
    display: flex;
}

/* Sidebar */
.sidebar {
    width: 250px;
    background: #171717;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.logo {
    font-size: 23px;
    font-weight: bold;
    color: white;
}

.new-chat {
    padding: 12px;
    border: 1px solid #444;
    background: transparent;
    color: white;
    border-radius: 8px;
    text-align: left;
    cursor: pointer;
}

.new-chat:hover {
    background: #303030;
}

.history {
    color: #aaa;
    font-size: 14px;
    line-height: 2.8;
}

.profile {
    margin-top: auto;
    border-top: 1px solid #444;
    padding-top: 18px;
}

/* Main area */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.topbar {
    padding: 20px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #333;
}

.topbar button {
    padding: 8px 13px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
}

.chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 30px 20px;
}

.welcome {
    max-width: 750px;
    margin: 10vh auto 30px;
    text-align: center;
}

.welcome h1 {
    font-size: 32px;
    margin-bottom: 30px;
}

.suggestions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.suggestion {
    background: #2b2b2b;
    padding: 18px;
    border: 1px solid #444;
    border-radius: 12px;
    text-align: left;
    color: white;
    cursor: pointer;
}

.suggestion:hover {
    background: #383838;
}

.message {
    max-width: 750px;
    margin: 20px auto;
    line-height: 1.7;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user-message {
    background: #303030;
    padding: 12px 18px;
    border-radius: 18px;
    width: fit-content;
    max-width: 85%;
    margin-left: auto;
}

.bot-message {
    padding: 12px 0;
}

/* Input */
.input-container {
    width: min(750px, 92%);
    margin: 0 auto 25px;
    background: #303030;
    border: 1px solid #555;
    border-radius: 20px;
    padding: 12px;
}

.input-row {
    display: flex;
    align-items: center;
    gap: 10px;
}

textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-size: 16px;
    resize: none;
    max-height: 120px;
    font-family: inherit;
    padding: 8px;
}

.send-btn {
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 50%;
    background: white;
    color: black;
    font-size: 20px;
    cursor: pointer;
}

.send-btn:hover {
    background: #ccc;
}

.note {
    color: #888;
    text-align: center;
    font-size: 11px;
    padding-top: 8px;
}

/* Light theme */
body.light {
    background: #f7f7f8;
    color: #222;
}

body.light .sidebar {
    background: #e9e9e9;
}

body.light .logo,
body.light .new-chat,
body.light .suggestion {
    color: #222;
}

body.light .new-chat,
body.light .suggestion {
    border-color: #ccc;
}

body.light .suggestion,
body.light .input-container {
    background: white;
}

body.light .input-container {
    border-color: #ccc;
}

body.light textarea {
    color: #222;
}

body.light .user-message {
    background: #e5e5e5;
}

@media (max-width: 650px) {
    .sidebar {
        width: 65px;
        padding: 12px 7px;
        align-items: center;
    }

    .logo {
        font-size: 12px;
    }

    .new-chat {
        font-size: 0;
        text-align: center;
        padding: 10px;
    }

    .new-chat::after {
        content: "+";
        font-size: 22px;
    }

    .history,
    .profile {
        display: none;
    }

    .welcome h1 {
        font-size: 25px;
    }

    .suggestions {
        grid-template-columns: 1fr;
    }

    .topbar {
        padding: 15px;
    }
}
</style>
</head>

<body>

<aside class="sidebar">
    <div class="logo">✳ ChatGPT</div>

    <button class="new-chat" onclick="newChat()">
        + New Chat
    </button>

    <div class="history">
        <p>Today</p>
        <div>💬 Web Development</div>
        <div>💬 Java Learning</div>
        <div>💬 Project Ideas</div>
    </div>

    <div class="profile">👤 Rahul Kumar</div>
</aside>

<main class="main">

    <header class="topbar">
        <strong>AI Assistant ▾</strong>
        <button onclick="toggleTheme()">☀️ Theme</button>
    </header>

    <section class="chat-area" id="chatArea">

        <div class="welcome" id="welcome">
            <h1>What can I help with?</h1>

            <div class="suggestions">
                <button class="suggestion"
                    onclick="usePrompt('Give me a frontend project idea')">
                    💡 <b>Get ideas</b><br>
                    Find your next project
                </button>

                <button class="suggestion"
                    onclick="usePrompt('Explain JavaScript for beginners')">
                    💻 <b>Learn coding</b><br>
                    Understand programming
                </button>

                <button class="suggestion"
                    onclick="usePrompt('Create a daily study plan')">
                    📚 <b>Make a plan</b><br>
                    Organize your learning
                </button>

                <button class="suggestion"
                    onclick="usePrompt('Give me 5 creative website ideas')">
                    🚀 <b>Be creative</b><br>
                    Explore something new
                </button>
            </div>
        </div>

    </section>

    <div class="input-container">
        <div class="input-row">
            <textarea id="userInput"
                rows="1"
                placeholder="Message AI Assistant..."
                onkeydown="handleKey(event)"
                oninput="autoResize(this)"></textarea>

            <button class="send-btn" onclick="sendMessage()">↑</button>
        </div>

        <div class="note">
            Demo interface · Responses are simulated, not generated by a real AI
        </div>
    </div>

</main>

<script>
const chatArea = document.getElementById("chatArea");
const input = document.getElementById("userInput");

function sendMessage() {
    const message = input.value.trim();

    if (!message) return;

    document.getElementById("welcome")?.remove();

    addMessage(message, "user-message");

    input.value = "";
    autoResize(input);

    const typing = document.createElement("div");
    typing.className = "message bot-message";
    typing.textContent = "✳ Thinking...";
    chatArea.appendChild(typing);
    chatArea.scrollTop = chatArea.scrollHeight;

    setTimeout(() => {
        typing.remove();
        addMessage(getReply(message), "bot-message");
    }, 700);
}

function addMessage(text, className) {
    const message = document.createElement("div");
    message.className = "message " + className;
    message.textContent = text;
    chatArea.appendChild(message);
    chatArea.scrollTop = chatArea.scrollHeight;
}

function getReply(text) {
    const query = text.toLowerCase();

    if (query.includes("hello") || query.includes("hi")) {
        return "Hello! 👋 Welcome to your AI chat demo. What would you like to explore today?";
    }

    if (query.includes("html") || query.includes("frontend")) {
        return "💻 Frontend Development Tip:\n\n1. Learn HTML for page structure.\n2. Use CSS for styling and responsive layouts.\n3. Learn JavaScript for interactivity.\n4. Build projects like a quiz, weather dashboard, and task manager.\n\nPractice consistently and keep building!";
    }

    if (query.includes("java")) {
        return "☕ Java Learning Roadmap:\n\n1. Variables and data types\n2. Conditions and loops\n3. Methods and arrays\n4. Object-Oriented Programming\n5. Collections Framework\n6. Data Structures and Algorithms\n7. Build projects!";
    }

    if (query.includes("project") || query.includes("idea")) {
        return "🚀 Project Ideas:\n\n1. Personal Portfolio\n2. Quiz Battle Game\n3. Expense Tracker\n4. Weather Dashboard\n5. Kanban Task Board\n6. Movie Search App\n\nTry building one with HTML, CSS, and JavaScript!";
    }

    if (query.includes("study") || query.includes("plan")) {
        return "📚 Sample Daily Study Plan:\n\n• 30 minutes: Learn a new concept\n• 45 minutes: Practice coding\n• 45 minutes: Build a project\n• 30 minutes: Solve DSA problems\n• 10 minutes: Review your progress\n\nAdjust the schedule to your needs!";
    }

    return "Thanks for your message! 😊\n\nThis is a frontend-only AI chat demo, so I can't generate a real AI answer. You can connect a backend and an AI API to make this interface intelligent.";
}

function usePrompt(prompt) {
    input.value = prompt;
    sendMessage();
}

function handleKey(event) {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
}

function autoResize(element) {
    element.style.height = "auto";
    element.style.height = Math.min(element.scrollHeight, 120) + "px";
}

function toggleTheme() {
    document.body.classList.toggle("light");
}

function newChat() {
    chatArea.innerHTML = `
        <div class="welcome" id="welcome">
            <h1>What can I help with?</h1>
            <div class="suggestions">
                <button class="suggestion"
                    onclick="usePrompt('Give me a frontend project idea')">
                    💡 <b>Get ideas</b><br>
                    Find your next project
                </button>
                <button class="suggestion"
                    onclick="usePrompt('Explain JavaScript for beginners')">
                    💻 <b>Learn coding</b><br>
                    Understand programming
                </button>
                <button class="suggestion"
                    onclick="usePrompt('Create a daily study plan')">
                    📚 <b>Make a plan</b><br>
                    Organize your learning
                </button>
                <button class="suggestion"
                    onclick="usePrompt('Give me 5 creative website ideas')">
                    🚀 <b>Be creative</b><br>
                    Explore something new
                </button>
            </div>
        </div>`;
}
</script>

</body>
</html>
```
