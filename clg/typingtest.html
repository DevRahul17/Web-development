```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typing Speed Test</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #0b1020;
    color: #f1f5f9;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 850px;
    background: #141b2d;
    padding: 35px;
    border-radius: 22px;
    border: 1px solid #26334d;
    box-shadow: 0 20px 60px #0005;
}

header {
    text-align: center;
    margin-bottom: 30px;
}

header h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

header h1 span {
    color: #38bdf8;
}

header p {
    color: #94a3b8;
    line-height: 1.6;
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 22px;
    flex-wrap: wrap;
}

select {
    background: #202b40;
    color: white;
    border: 1px solid #35435d;
    padding: 10px 14px;
    border-radius: 9px;
    outline: none;
    font-size: 14px;
}

.status {
    color: #38bdf8;
    font-size: 14px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 25px;
}

.stat {
    background: #1c2740;
    padding: 18px 10px;
    text-align: center;
    border-radius: 13px;
    border: 1px solid #2c3a55;
}

.stat h2 {
    font-size: 27px;
    color: #38bdf8;
    margin-bottom: 7px;
}

.stat p {
    font-size: 12px;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.progress-track {
    height: 5px;
    background: #26334d;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 22px;
}

.progress {
    height: 100%;
    width: 0%;
    background: #38bdf8;
    transition: width 0.15s;
}

.text-display {
    background: #0f172a;
    border: 1px solid #26334d;
    border-radius: 13px;
    padding: 24px;
    font-size: 19px;
    line-height: 1.9;
    color: #718096;
    margin-bottom: 20px;
    min-height: 155px;
    overflow-wrap: anywhere;
}

.text-display span.correct {
    color: #4ade80;
}

.text-display span.incorrect {
    color: #fb7185;
    background: #7f1d1d55;
    border-radius: 3px;
}

.text-display span.current {
    border-left: 2px solid #38bdf8;
    animation: blink 0.8s infinite;
}

@keyframes blink {
    50% { border-color: transparent; }
}

textarea {
    width: 100%;
    min-height: 125px;
    resize: vertical;
    background: #1c2740;
    border: 1px solid #35435d;
    color: #fff;
    padding: 17px;
    border-radius: 12px;
    font-size: 16px;
    line-height: 1.6;
    outline: none;
    transition: border 0.2s;
}

textarea:focus {
    border-color: #38bdf8;
}

textarea::placeholder {
    color: #718096;
}

.buttons {
    display: flex;
    gap: 12px;
    margin-top: 20px;
}

button {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: translateY(-2px);
}

.restart {
    background: #26334d;
    color: white;
}

.restart:hover {
    background: #35435d;
}

.finish {
    background: #38bdf8;
    color: #08111f;
}

.finish:hover {
    background: #7dd3fc;
}

.result {
    display: none;
    margin-top: 22px;
    padding: 22px;
    border-radius: 13px;
    background: #0f2b2a;
    border: 1px solid #166653;
    text-align: center;
}

.result h2 {
    color: #4ade80;
    margin-bottom: 10px;
}

.result p {
    color: #d1fae5;
    line-height: 1.8;
}

footer {
    margin-top: 25px;
    text-align: center;
    font-size: 12px;
    color: #64748b;
}

@media (max-width: 600px) {
    .container {
        padding: 20px;
    }

    header h1 {
        font-size: 26px;
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .text-display {
        font-size: 17px;
        padding: 16px;
    }

    .buttons {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="container">

    <header>
        <h1>⌨️ Typing <span>Speed Test</span></h1>
        <p>Test your typing speed, improve your accuracy,<br>
        and challenge yourself to type faster!</p>
    </header>

    <div class="top-bar">
        <select id="difficulty" aria-label="Choose difficulty">
            <option value="easy">Easy Text</option>
            <option value="medium" selected>Medium Text</option>
            <option value="hard">Hard Text</option>
        </select>

        <div class="status" id="status">● Ready to start</div>
    </div>

    <div class="stats">
        <div class="stat">
            <h2 id="time">60</h2>
            <p>Seconds</p>
        </div>

        <div class="stat">
            <h2 id="wpm">0</h2>
            <p>WPM</p>
        </div>

        <div class="stat">
            <h2 id="accuracy">100%</h2>
            <p>Accuracy</p>
        </div>

        <div class="stat">
            <h2 id="errors">0</h2>
            <p>Errors</p>
        </div>
    </div>

    <div class="progress-track">
        <div class="progress" id="progress"></div>
    </div>

    <div class="text-display" id="textDisplay"></div>

    <textarea
        id="typingInput"
        placeholder="Start typing the text above here..."
        spellcheck="false"
        autocomplete="off"
        autocapitalize="off"
        aria-label="Type the displayed passage here"
    ></textarea>

    <div class="buttons">
        <button class="restart" id="restartBtn">↻ Restart Test</button>
        <button class="finish" id="finishBtn">Finish Test ✓</button>
    </div>

    <div class="result" id="result">
        <h2>🎉 Test Completed!</h2>
        <p id="resultText"></p>
    </div>

    <footer>
        Keep practising every day. Consistency makes you faster! 🚀
    </footer>

</div>

<script>
const passages = {
    easy: "Learning to type faster is a useful skill for students and developers. Practice every day, focus on accuracy, and gradually increase your speed. Small improvements can make a big difference over time.",

    medium: "Programming is not just about writing code; it is about solving problems with patience and creativity. A good developer understands the logic behind a solution, tests different approaches, and learns from mistakes. Consistent practice builds confidence and improves problem-solving skills.",

    hard: "Modern software development requires curiosity, logical reasoning, and attention to detail. Developers frequently analyze complex problems, evaluate alternative solutions, and write maintainable code. The combination of disciplined practice, collaboration, and continuous learning leads to long-term professional growth."
};

const textDisplay = document.getElementById("textDisplay");
const typingInput = document.getElementById("typingInput");
const timeDisplay = document.getElementById("time");
const wpmDisplay = document.getElementById("wpm");
const accuracyDisplay = document.getElementById("accuracy");
const errorsDisplay = document.getElementById("errors");
const progress = document.getElementById("progress");
const statusDisplay = document.getElementById("status");
const difficulty = document.getElementById("difficulty");
const result = document.getElementById("result");
const resultText = document.getElementById("resultText");

let originalText = "";
let timer = null;
let timeLeft = 60;
let started = false;
let finished = false;
let correctChars = 0;
let totalErrors = 0;

function loadText() {
    originalText = passages[difficulty.value];
    textDisplay.innerHTML = "";

    [...originalText].forEach((character, index) => {
        const span = document.createElement("span");
        span.textContent = character;

        if (index === 0) {
            span.classList.add("current");
        }

        textDisplay.appendChild(span);
    });
}

function startTest() {
    if (started || finished) return;

    started = true;
    statusDisplay.textContent = "● Test in progress";

    timer = setInterval(() => {
        timeLeft--;
        timeDisplay.textContent = timeLeft;

        updateStats();

        if (timeLeft <= 0) {
            endTest();
        }
    }, 1000);
}

function updateText() {
    const typedText = typingInput.value;
    const characters = textDisplay.querySelectorAll("span");

    correctChars = 0;
    totalErrors = 0;

    characters.forEach((span, index) => {
        span.className = "";

        if (index < typedText.length) {
            if (typedText[index] === originalText[index]) {
                span.classList.add("correct");
                correctChars++;
            } else {
                span.classList.add("incorrect");
                totalErrors++;
            }
        }

        if (index === typedText.length && !finished) {
            span.classList.add("current");
        }
    });

    updateStats();

    if (typedText.length >= originalText.length) {
        endTest();
    }
}

function updateStats() {
    const elapsed = 60 - timeLeft;
    const minutes = elapsed / 60;

    const wpm = minutes > 0
        ? Math.round((correctChars / 5) / minutes)
        : 0;

    const typedLength = typingInput.value.length;
    const accuracy = typedLength > 0
        ? Math.round((correctChars / typedLength) * 100)
        : 100;

    wpmDisplay.textContent = wpm;
    accuracyDisplay.textContent = accuracy + "%";
    errorsDisplay.textContent = totalErrors;

    progress.style.width =
        (typingInput.value.length / originalText.length * 100) + "%";
}

function endTest() {
    if (finished) return;

    finished = true;
    clearInterval(timer);

    typingInput.disabled = true;
    difficulty.disabled = false;

    statusDisplay.textContent = "● Test completed";

    const elapsed = 60 - timeLeft;
    const minutes = elapsed / 60;
    const finalWpm = minutes > 0
        ? Math.round((correctChars / 5) / minutes)
        : 0;

    const accuracy = typingInput.value.length > 0
        ? Math.round((correctChars / typingInput.value.length) * 100)
        : 100;

    result.style.display = "block";

    let message = "Keep practising to improve your speed!";

    if (finalWpm >= 60) {
        message = "Excellent! Your typing speed is impressive! 🚀";
    } else if (finalWpm >= 40) {
        message = "Great job! You have a good typing pace. 👏";
    } else if (finalWpm >= 25) {
        message = "Good start! Keep practising consistently. 💪";
    }

    resultText.innerHTML =
        "Typing Speed: <strong>" + finalWpm + " WPM</strong><br>" +
        "Accuracy: <strong>" + accuracy + "%</strong><br>" +
        "Errors: <strong>" + totalErrors + "</strong><br>" +
        "Time Used: <strong>" + elapsed + " seconds</strong><br><br>" +
        message;
}

function restartTest() {
    clearInterval(timer);

    timeLeft = 60;
    started = false;
    finished = false;
    correctChars = 0;
    totalErrors = 0;

    timeDisplay.textContent = timeLeft;
    wpmDisplay.textContent = 0;
    accuracyDisplay.textContent = "100%";
    errorsDisplay.textContent = 0;
    progress.style.width = "0%";

    typingInput.value = "";
    typingInput.disabled = false;

    result.style.display = "none";
    statusDisplay.textContent = "● Ready to start";

    difficulty.disabled = false;

    loadText();
    typingInput.focus();
}

typingInput.addEventListener("input", () => {
    if (finished) return;

    startTest();
    updateText();
});

document.getElementById("restartBtn").addEventListener(
    "click", restartTest
);

document.getElementById("finishBtn").addEventListener(
    "click", () => {
        if (started) {
            updateText();
            endTest();
        } else {
            statusDisplay.textContent = "● Type something to start!";
            typingInput.focus();
        }
    }
);

difficulty.addEventListener("change", restartTest);

loadText();
</script>

</body>
</html>
```
