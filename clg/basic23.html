<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Task Manager</title>

    <!-- CSS Styling (Internal / Inline-ready layout) -->
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --danger-color: #ef4444;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .todo-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 450px;
        }

        header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        header p {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-group input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--primary-color);
        }

        .input-group button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .input-group button:hover {
            background-color: var(--primary-hover);
        }

        .task-list {
            list-style: none;
            max-height: 300px;
            overflow-y: auto;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .task-item:last-child {
            border-bottom: none;
        }

        .task-content {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            user-select: none;
        }

        .task-content input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        .task-text {
            font-size: 16px;
            transition: all 0.2s;
        }

        .completed .task-text {
            text-decoration: line-through;
            color: #9ca3af;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            font-size: 16px;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .delete-btn:hover {
            color: var(--danger-color);
            background-color: #fee2e2;
        }

        .empty-state {
            text-align: center;
            color: #9ca3af;
            padding: 20px 0;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <!-- UI Layout HTML Structure -->
    <div class="todo-card">
        <header>
            <h1>Task Manager</h1>
            <p>Stay organized and check off your goals.</p>
        </header>

        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Add a new task..." autocomplete="off">
            <button id="addBtn">Add</button>
        </div>

        <ul class="task-list" id="taskList">
            <!-- Dynamic list items inject here -->
        </ul>

        <div id="emptyState" class="empty-state">No tasks remaining! 🎉</div>
    </div>

    <!-- JS Logic (Functional Interface Controls) -->
    <script>
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');
        const emptyState = document.getElementById('emptyState');

        // Local Array state for management
        let tasks = [];

        function renderTasks() {
            taskList.innerHTML = '';

            if (tasks.length === 0) {
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';

                tasks.forEach((task, index) => {
                    const li = document.createElement('li');
                    li.className = `task-item ${task.completed ? 'completed' : ''}`;

                    li.innerHTML = `
            <div class="task-content" onclick="toggleTask(${index})">
              <input type="checkbox" ${task.completed ? 'checked' : ''}>
              <span class="task-text">${task.text}</span>
            </div>
            <button class="delete-btn" onclick="deleteTask(event, ${index})">✕</button>
          `;

                    taskList.appendChild(li);
                });
            }
        }

        function addTask() {
            const text = taskInput.value.trim();
            if (text !== '') {
                tasks.push({ text: text, completed: false });
                taskInput.value = '';
                renderTasks();
            }
        }

        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            renderTasks();
        }

        function deleteTask(event, index) {
            event.stopPropagation(); // Prevents completion trigger when clicking delete
            tasks.splice(index, 1);
            renderTasks();
        }

        // Event Listeners
        addBtn.addEventListener('click', addTask);
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });

        // Initial Empty Render
        renderTasks();
    </script>
</body>

</html>
