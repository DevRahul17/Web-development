
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Motivation</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #667eea, #764ba2);
  padding: 20px;
}

.card {
  background: white;
  max-width: 430px;
  width: 100%;
  padding: 35px 25px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 15px 40px #0003;
}

.icon {
  font-size: 48px;
  margin-bottom: 15px;
}

h1 {
  color: #333;
  margin-bottom: 20px;
}

#quote {
  font-size: 20px;
  line-height: 1.6;
  color: #555;
  margin-bottom: 15px;
}

#author {
  color: #764ba2;
  font-weight: bold;
  margin-bottom: 25px;
}

button {
  background: #764ba2;
  color: white;
  border: none;
  padding: 13px 20px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 15px;
  margin: 5px;
  transition: 0.3s;
}

button:hover {
  background: #5b3485;
  transform: translateY(-2px);
}

#message {
  margin-top: 15px;
  color: #228b55;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="card">
  <div class="icon">💡</div>
  <h1>Daily Motivation</h1>

  <p id="quote">
    Believe in yourself and all that you are.
  </p>

  <p id="author">— Your Daily Reminder</p>

  <button onclick="newQuote()">✨ New Quote</button>
  <button onclick="copyQuote()">📋 Copy Quote</button>

  <p id="message"></p>
</div>

<script>
const quotes = [
  {
    text: "Believe in yourself and all that you are.",
    author: "Unknown"
  },
  {
    text: "Great things take time. Keep going!",
    author: "Unknown"
  },
  {
    text: "Dream big and dare to fail.",
    author: "Norman Vaughan"
  },
  {
    text: "Success is the sum of small efforts.",
    author: "Robert Collier"
  },
  {
    text: "Your only limit is your mind.",
    author: "Unknown"
  },
  {
    text: "Do something today that your future self will thank you for.",
    author: "Unknown"
  }
];

function newQuote() {
  const randomIndex = Math.floor(Math.random() * quotes.length);

  document.getElementById("quote").textContent =
    quotes[randomIndex].text;

  document.getElementById("author").textContent =
    "— " + quotes[randomIndex].author;

  document.getElementById("message").textContent = "";
}

function copyQuote() {
  const quote = document.getElementById("quote").textContent;
  const author = document.getElementById("author").textContent;

  navigator.clipboard.writeText(quote + " " + author)
    .then(() => {
      document.getElementById("message").textContent =
        "✅ Quote copied successfully!";
    })
    .catch(() => {
      document.getElementById("message").textContent =
        "Please open the page in a browser to copy the quote.";
    });
}
</script>

</body>
</html>
