<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model Demo</title>
    <style>
        /* Modern reset to make box sizing intuitive */
        * {
            box-sizing: border-box; 
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* The Box Model Example */
        .box-container {
            /* 1. Content Dimensions */
            width: 300px;
            height: 150px;
            background-color: #3498db;
            color: white;

            /* 2. Padding: Space inside, around the text */
            padding: 20px;

            /* 3. Border: The frame around the padding */
            border: 10px solid #2c3e50;

            /* 4. Margin: Space outside the element pushing others away */
            margin: 40px;
            
            /* Center text inside content area */
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="box-container">
        This text lives inside the Content Area.
    </div>

</body>
</html>
