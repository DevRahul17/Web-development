<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🪐 Solar System Explorer</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #02030a;
    color: white;
    overflow-x: hidden;
}

/* ================= BACKGROUND ================= */

.space {
    min-height: 100vh;
    position: relative;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 50%, #10163a 0%, #050719 35%, #010208 75%);
}

.space::before,
.space::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(#ffffff 1px, transparent 1px);
    background-size: 90px 90px, 140px 140px;
    background-position: 10px 20px, 60px 80px;
    opacity: .35;
    animation: stars 35s linear infinite;
}

.space::after {
    background-size: 180px 180px;
    opacity: .18;
    animation-duration: 60s;
}

@keyframes stars {
    from {
        transform: translateY(0);
    }
    to {
        transform: translateY(180px);
    }
}

/* ================= HEADER ================= */

header {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 30px 20px 10px;
}

header h1 {
    font-size: clamp(2rem, 5vw, 4rem);
    letter-spacing: 3px;
    background: linear-gradient(90deg, #7dd3fc, #c084fc, #f0abfc);
    -webkit-background-clip: text;
    color: transparent;
    animation: titleGlow 3s infinite alternate;
}

header p {
    margin-top: 10px;
    color: #9ca3af;
    font-size: 1rem;
}

@keyframes titleGlow {
    from {
        filter: drop-shadow(0 0 5px #7dd3fc);
    }
    to {
        filter: drop-shadow(0 0 20px #c084fc);
    }
}

/* ================= SOLAR SYSTEM ================= */

.solar-system {
    width: 100%;
    height: 650px;
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* SUN */

.sun {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff7a8, #ffd000 35%, #ff7b00 70%, #ff3d00);
    box-shadow:
        0 0 30px #ffae00,
        0 0 70px #ff7b00,
        0 0 120px rgba(255, 120, 0, .5);
    position: absolute;
    z-index: 5;
    cursor: pointer;
    transition: .3s;
}

.sun:hover {
    transform: scale(1.12);
}

/* ORBITS */

.orbit {
    position: absolute;
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 50%;
    animation: rotate linear infinite;
}

.orbit:hover {
    border-color: rgba(255,255,255,.5);
}

.orbit1 {
    width: 150px;
    height: 150px;
    animation-duration: 8s;
}

.orbit2 {
    width: 210px;
    height: 210px;
    animation-duration: 12s;
}

.orbit3 {
    width: 280px;
    height: 280px;
    animation-duration: 17s;
}

.orbit4 {
    width: 360px;
    height: 360px;
    animation-duration: 22s;
}

.orbit5 {
    width: 450px;
    height: 450px;
    animation-duration: 30s;
}

.orbit6 {
    width: 540px;
    height: 540px;
    animation-duration: 37s;
}

.orbit7 {
    width: 630px;
    height: 630px;
    animation-duration: 45s;
}

.orbit8 {
    width: 720px;
    height: 720px;
    animation-duration: 55s;
}

@keyframes rotate {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(360deg);
    }
}

/* ================= PLANETS ================= */

.planet {
    position: absolute;
    left: 50%;
    top: 50%;
    border-radius: 50%;
    cursor: pointer;
    transition: .3s;
    transform-origin: center;
}

.planet:hover {
    transform: scale(1.5);
    z-index: 20;
}

/* Planet positioning */

.mercury {
    width: 13px;
    height: 13px;
    background: #a8a8a8;
    top: 1px;
    left: 50%;
}

.venus {
    width: 19px;
    height: 19px;
    background: #d69b5d;
    top: 1px;
    left: 50%;
}

.earth {
    width: 23px;
    height: 23px;
    background: radial-gradient(circle at 35% 30%, #7dd3fc, #2563eb 55%, #14532d);
    top: 1px;
    left: 50%;
    box-shadow: 0 0 10px #38bdf8;
}

.mars {
    width: 18px;
    height: 18px;
    background: #c2410c;
    top: 1px;
    left: 50%;
}

.jupiter {
    width: 45px;
    height: 45px;
    background: linear-gradient(
        #c89b6b 0%,
        #e5c59b 20%,
        #8b5e3c 30%,
        #d8b58c 50%,
        #7b4d32 70%,
        #d4ad82 90%
    );
    top: 1px;
    left: 50%;
}

.saturn {
    width: 38px;
    height: 38px;
    background: #d7bd85;
    top: 1px;
    left: 50%;
}

.saturn::after {
    content: "";
    position: absolute;
    width: 65px;
    height: 18px;
    border: 4px solid rgba(220,190,130,.7);
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) rotate(-15deg);
}

.uranus {
    width: 29px;
    height: 29px;
    background: #7dd3fc;
    top: 1px;
    left: 50%;
}

.neptune {
    width: 28px;
    height: 28px;
    background: #2563eb;
    top: 1px;
    left: 50%;
    box-shadow: 0 0 12px #2563eb;
}

/* ================= INFO PANEL ================= */

.info-panel {
    position: fixed;
    right: 25px;
    bottom: 25px;
    width: min(360px, calc(100% - 50px));
    padding: 25px;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 20px;
    background: rgba(10,15,35,.75);
    backdrop-filter: blur(18px);
    box-shadow: 0 15px 50px rgba(0,0,0,.5);
    z-index: 50;
    transform: translateY(150%);
    transition: .5s ease;
}

.info-panel.active {
    transform: translateY(0);
}

.info-panel h2 {
    color: #7dd3fc;
    margin-bottom: 10px;
    font-size: 1.8rem;
}

.info-panel p {
    color: #cbd5e1;
    line-height: 1.6;
}

.info-panel .fact {
    margin-top: 15px;
    padding: 12px;
    border-radius: 12px;
    background: rgba(255,255,255,.06);
    color: #e2e8f0;
}

.close {
    position: absolute;
    right: 15px;
    top: 12px;
    border: none;
    background: transparent;
    color: white;
    font-size: 22px;
    cursor: pointer;
}

/* ================= PLANET MENU ================= */

.planet-menu {
    position: relative;
    z-index: 20;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 15px 20px 30px;
}

.planet-menu button {
    border: 1px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.06);
    color: #dbeafe;
    padding: 10px 16px;
    border-radius: 30px;
    cursor: pointer;
    transition: .3s;
    backdrop-filter: blur(10px);
}

.planet-menu button:hover,
.planet-menu button.active {
    background: rgba(125,211,252,.2);
    border-color: #7dd3fc;
    box-shadow: 0 0 15px rgba(125,211,252,.3);
    transform: translateY(-3px);
}

/* ================= CONTROL BUTTON ================= */

.controls {
    position: fixed;
    top: 25px;
    right: 25px;
    z-index: 100;
}

.controls button {
    padding: 12px 18px;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 30px;
    background: rgba(255,255,255,.08);
    color: white;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: .3s;
}

.controls button:hover {
    background: rgba(125,211,252,.2);
    transform: scale(1.05);
}

/* PAUSED */

.paused .orbit {
    animation-play-state: paused;
}

/* ================= RESPONSIVE ================= */

@media (max-width: 800px) {
    .solar-system {
        height: 500px;
        transform: scale(.7);
    }

    .orbit8 {
        width: 600px;
        height: 600px;
    }

    .info-panel {
        bottom: 15px;
        right: 15px;
    }

    .controls {
        top: 15px;
        right: 15px;
    }
}

@media (max-width: 500px) {
    header {
        padding-top: 70px;
    }

    .solar-system {
        height: 400px;
        transform: scale(.52);
    }

    .planet-menu {
        padding-bottom: 20px;
    }

    .info-panel {
        width: calc(100% - 30px);
        right: 15px;
    }
}
</style>
</head>

<body>

<div class="space" id="space">

    <header>
        <h1>🪐 Solar System Explorer</h1>
        <p>Explore our cosmic neighborhood</p>
    </header>

    <!-- CONTROL -->
    <div class="controls">
        <button onclick="toggleAnimation()" id="animationBtn">
            ⏸ Pause
        </button>
    </div>

    <!-- SOLAR SYSTEM -->

    <div class="solar-system">

        <div class="sun" onclick="showPlanet('sun')"></div>

        <div class="orbit orbit1">
            <div class="planet mercury"
                 onclick="showPlanet('mercury')"></div>
        </div>

        <div class="orbit orbit2">
            <div class="planet venus"
                 onclick="showPlanet('venus')"></div>
        </div>

        <div class="orbit orbit3">
            <div class="planet earth"
                 onclick="showPlanet('earth')"></div>
        </div>

        <div class="orbit orbit4">
            <div class="planet mars"
                 onclick="showPlanet('mars')"></div>
        </div>

        <div class="orbit orbit5">
            <div class="planet jupiter"
                 onclick="showPlanet('jupiter')"></div>
        </div>

        <div class="orbit orbit6">
            <div class="planet saturn"
                 onclick="showPlanet('saturn')"></div>
        </div>

        <div class="orbit orbit7">
            <div class="planet uranus"
                 onclick="showPlanet('uranus')"></div>
        </div>

        <div class="orbit orbit8">
            <div class="planet neptune"
                 onclick="showPlanet('neptune')"></div>
        </div>

    </div>

    <!-- PLANET MENU -->

    <div class="planet-menu">
        <button onclick="showPlanet('sun')">☀️ Sun</button>
        <button onclick="showPlanet('mercury')">☿ Mercury</button>
        <button onclick="showPlanet('venus')">♀ Venus</button>
        <button onclick="showPlanet('earth')">🌍 Earth</button>
        <button onclick="showPlanet('mars')">♂ Mars</button>
        <button onclick="showPlanet('jupiter')">♃ Jupiter</button>
        <button onclick="showPlanet('saturn')">♄ Saturn</button>
        <button onclick="showPlanet('uranus')">♅ Uranus</button>
        <button onclick="showPlanet('neptune')">♆ Neptune</button>
    </div>

</div>

<!-- INFO PANEL -->

<div class="info-panel" id="infoPanel">

    <button class="close" onclick="closePanel()">×</button>

    <h2 id="planetName">Earth</h2>

    <p id="planetDescription">
        Our home planet and the only known planet with life.
    </p>

    <div class="fact" id="planetFact">
        🌎 Earth has one natural satellite — the Moon.
    </div>

</div>


<script>

const planets = {

    sun: {
        name: "☀️ The Sun",
        description:
        "The Sun is the star at the center of our solar system. Almost all the energy that powers life on Earth comes from it.",
        fact:
        "🔥 The Sun contains about 99.8% of the mass of the entire Solar System."
    },

    mercury: {
        name: "☿ Mercury",
        description:
        "Mercury is the smallest planet and the closest planet to the Sun.",
        fact:
        "🌡️ Temperatures can range from extremely hot during the day to extremely cold at night."
    },

    venus: {
        name: "♀ Venus",
        description:
        "Venus is a rocky planet with a thick atmosphere dominated by carbon dioxide.",
        fact:
        "🔥 Venus is the hottest planet in our Solar System."
    },

    earth: {
        name: "🌍 Earth",
        description:
        "Earth is our home planet and the only world currently known to support life.",
        fact:
        "🌙 Earth has one natural satellite — the Moon."
    },

    mars: {
        name: "♂ Mars",
        description:
        "Mars is a cold, rocky planet famous for its reddish surface and large volcanoes.",
        fact:
        "🔴 Mars is often called the Red Planet because of iron minerals in its soil."
    },

    jupiter: {
        name: "♃ Jupiter",
        description:
        "Jupiter is the largest planet in our Solar System and is a gas giant.",
        fact:
        "🌪️ Jupiter's Great Red Spot is a gigantic storm that has lasted for centuries."
    },

    saturn: {
        name: "♄ Saturn",
        description:
        "Saturn is a gas giant famous for its spectacular ring system.",
        fact:
        "💍 Saturn's rings are mostly made of pieces of ice and rock."
    },

    uranus: {
        name: "♅ Uranus",
        description:
        "Uranus is an ice giant with a blue-green appearance caused by methane in its atmosphere.",
        fact:
        "🔄 Uranus rotates on its side compared with most planets."
    },

    neptune: {
        name: "♆ Neptune",
        description:
        "Neptune is the farthest recognized planet from the Sun and is an ice giant.",
        fact:
        "💨 Neptune has some of the fastest winds recorded in the Solar System."
    }

};


function showPlanet(planet) {

    const data = planets[planet];

    document.getElementById("planetName").textContent = data.name;

    document.getElementById("planetDescription").textContent =
        data.description;

    document.getElementById("planetFact").textContent =
        data.fact;

    document.getElementById("infoPanel").classList.add("active");

    document.querySelectorAll(".planet-menu button")
        .forEach(button => button.classList.remove("active"));

}


function closePanel() {

    document.getElementById("infoPanel")
        .classList.remove("active");

}


function toggleAnimation() {

    const space = document.getElementById("space");
    const button = document.getElementById("animationBtn");

    space.classList.toggle("paused");

    if (space.classList.contains("paused")) {
        button.textContent = "▶ Resume";
    } else {
        button.textContent = "⏸ Pause";
    }

}


/* Mouse-follow glow */

document.addEventListener("mousemove", (e) => {

    const x = e.clientX;
    const y = e.clientY;

    document.querySelector(".space").style.background =
        `radial-gradient(circle at ${x}px ${y}px,
        rgba(59,130,246,.15),
        #050719 25%,
        #010208 70%)`;

});

</script>

</body>
</html>
