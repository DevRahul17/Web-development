<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample HTML Form</title>
</head>
<body>

    <h2>Contact & Registration Form</h2>

    <!-- The form starts here -->
    <form action="/submit-form-endpoint" method="POST">
        
        <!-- Text Input for Name -->
        <div>
            <label for="fullName">Full Name:</label>
            <input type="text" id="fullName" name="fullName" placeholder="John Doe" required>
        </div>
        <br>

        <!-- Email Input with implicit validation -->
        <div>
            <label for="userEmail">Email Address:</label>
            <input type="email" id="userEmail" name="userEmail" placeholder="name@example.com" required>
        </div>
        <br>

        <!-- Password Input -->
        <div>
            <label for="userPassword">Password:</label>
            <input type="password" id="userPassword" name="userPassword" minlength="8" required>
        </div>
        <br>

        <!-- Dropdown Select Menu -->
        <div>
            <label for="country">Country:</label>
            <select id="country" name="country">
                <option value="us">United States</option>
                <option value="ca">Canada</option>
                <option value="uk">United Kingdom</option>
                <option value="other">Other</option>
            </select>
        </div>
        <br>

        <!-- Radio Buttons (Select only one) -->
        <div>
            <label>Preferred Contact Method:</label><br>
            <input type="radio" id="contactEmail" name="contactMethod" value="email" checked>
            <label for="contactEmail">Email</label><br>
            
            <input type="radio" id="contactPhone" name="contactMethod" value="phone">
            <label for="contactPhone">Phone</label>
        </div>
        <br>

        <!-- Checkbox (Select multiple / toggle) -->
        <div>
            <input type="checkbox" id="subscribe" name="subscribe" value="newsletter">
            <label for="subscribe">Subscribe to weekly newsletter</label>
        </div>
        <br>

        <!-- Large Multi-line Text Area -->
        <div>
            <label for="message">Comments/Message:</label><br>
            <textarea id="message" name="message" rows="4" cols="40" placeholder="Type your message here..."></textarea>
        </div>
        <br>

        <!-- Submit Button -->
        <div>
            <button type="submit">Submit Form</button>
            <button type="reset">Clear Data</button>
        </div>

    </form>
    <!-- The form ends here -->

</body>
</html>
