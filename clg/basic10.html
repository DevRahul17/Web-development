<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Iframe Layout</title>
    <style>
        /* Remove default browser gaps */
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Main container splits the screen into rows */
        .page-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        /* First row splits into two columns */
        .top-row {
            display: flex;
            flex-direction: row;
            height: 50%;
            /* Adjust top row height here */
            width: 100%;
        }

        /* Second row takes up the rest */
        .bottom-row {
            height: 50%;
            /* Adjust bottom row height here */
            width: 100%;
        }

        /* Make all iframes fill their allocated grid spaces completely */
        iframe {
            width: 100%;
            height: 100%;
            border: 2px solid #ccc;
            /* Optional visible border */
            box-sizing: border-box;
        }

        /* Split the top row columns equally */
        .column {
            flex: 1;
        }
    </style>
</head>

<body>

    <div class="page-container">

        <!-- Row 1: Divided into Two Columns -->
        <div class="top-row">
            <div class="column">
                <iframe src="https://example.com" title="Top Left Frame"></iframe>
            </div>
            <div class="column">
                <iframe src="https://example.com" title="Top Right Frame"></iframe>
            </div>
        </div>

        <!-- Row 2: Full Width -->
        <div class="bottom-row">
            <iframe src="https://example.com" title="Bottom Frame"></iframe>
        </div>

    </div>

</body>

</html>
