```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎲 Dice Battle</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background:
            radial-gradient(circle at top, #243b55, #141e30 60%, #080d16);
        color: white;
        padding: 20px;
    }

    .game {
        width: 850px;
        max-width: 100%;
        padding: 35px;
        border-radius: 25px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.15);
        backdrop-filter: blur(15px);
        box-shadow: 0 25px 70px rgba(0,0,0,0.45);
        text-align: center;
    }

    h1 {
        font-size: 42px;
        margin-bottom: 8px;
    }

    .subtitle {
        color: #b8c4d6;
        margin-bottom: 30px;
    }

    .scores {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 35px;
    }

    .score-box {
        width: 180px;
        padding: 18px;
        border-radius: 18px;
        background: rgba(255,255,255,0.07);
    }

    .score-box h3 {
        color: #aebbd0;
        margin-bottom: 8px;
    }

    .score {
        font-size: 35px;
        font-weight: bold;
    }

    .battle {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 70px;
        margin: 25px 0 35px;
    }

    .player h2 {
        margin-bottom: 15px;
        font-size: 20px;
    }

    .dice {
        width: 140px;
        height: 140px;
        background: white;
        border-radius: 22px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        padding: 18px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.35);
    }

    .dot {
        width: 22px;
        height: 22px;
        background: #111827;
        border-radius: 50%;
        align-self: center;
        justify-self: center;
        opacity: 0;
    }

    .dice.rolling {
        animation: shake 0.55s infinite;
    }

    @keyframes shake {
        0% { transform: rotate(0deg) scale(1); }
        25% { transform: rotate(8deg) scale(1.05); }
        50% { transform: rotate(-8deg) scale(0.95); }
        75% { transform: rotate(6deg) scale(1.05); }
        100% { transform: rotate(0deg) scale(1); }
    }

    .vs {
        font-size: 28px;
        font-weight: bold;
        color: #ffcc00;
    }

    button {
        border: none;
        padding: 15px 35px;
        border-radius: 12px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        color: white;
        background: linear-gradient(135deg, #7c3aed, #2563eb);
        box-shadow: 0 10px 25px rgba(37,99,235,0.35);
        transition: 0.25s;
    }

    button:hover {
        transform: translateY(-3px) scale(1.03);
    }

    button:active {
        transform: scale(0.96);
    }

    button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
    }

    #result {
        min-height: 30px;
        margin: 22px 0;
        font-size: 21px;
        font-weight: bold;
    }

    .history {
        margin-top: 30px;
        text-align: left;
    }

    .history h2 {
        margin-bottom: 12px;
    }

    #historyList {
        max-height: 150px;
        overflow-y: auto;
    }

    .history-item {
        display: flex;
        justify-content: space-between;
        padding: 10px 14px;
        margin: 6px 0;
        border-radius: 10px;
        background: rgba(255,255,255,0.06);
        color: #d8e0ed;
    }

    .reset {
        margin-top: 15px;
        background: rgba(255,255,255,0.1);
        box-shadow: none;
        padding: 10px 22px;
        font-size: 14px;
    }

    @media(max-width: 650px) {
        .game {
            padding: 22px;
        }

        h1 {
            font-size: 32px;
        }

        .battle {
            gap: 15px;
        }

        .dice {
            width: 105px;
            height: 105px;
            padding: 13px;
        }

        .dot {
            width: 17px;
            height: 17px;
        }

        .vs {
            font-size: 20px;
        }
    }
</style>
</head>

<body>

<div class="game">

    <h1>🎲 Dice Battle</h1>
    <p class="subtitle">Roll the dice and beat the computer!</p>

    <div class="scores">
        <div class="score-box">
            <h3>YOU</h3>
            <div class="score" id="playerScore">0</div>
        </div>

        <div class="score-box">
            <h3>COMPUTER</h3>
            <div class="score" id="computerScore">0</div>
        </div>
    </div>

    <div class="battle">

        <div class="player">
            <h2>👤 You</h2>
            <div class="dice" id="playerDice"></div>
        </div>

        <div class="vs">VS</div>

        <div class="player">
            <h2>🤖 Computer</h2>
            <div class="dice" id="computerDice"></div>
        </div>

    </div>

    <button id="rollBtn" onclick="rollDice()">🎲 Roll Dice</button>

    <div id="result">Ready? Roll the dice!</div>

    <div class="history">
        <h2>📜 Round History</h2>
        <div id="historyList"></div>
    </div>

    <button class="reset" onclick="resetGame()">🔄 Reset Game</button>

</div>

<script>

let playerScore = 0;
let computerScore = 0;
let round = 0;

const dicePatterns = {
    1: [4],
    2: [0, 8],
    3: [0, 4, 8],
    4: [0, 2, 6, 8],
    5: [0, 2, 4, 6, 8],
    6: [0, 2, 3, 5, 6, 8]
};

function createDice(number, element) {

    element.innerHTML = "";

    for (let i = 0; i < 9; i++) {

        const dot = document.createElement("div");
        dot.className = "dot";

        if (dicePatterns[number].includes(i)) {
            dot.style.opacity = "1";
        }

        element.appendChild(dot);
    }
}

createDice(1, document.getElementById("playerDice"));
createDice(1, document.getElementById("computerDice"));


function rollDice() {

    const button = document.getElementById("rollBtn");
    const playerDice = document.getElementById("playerDice");
    const computerDice = document.getElementById("computerDice");

    button.disabled = true;

    playerDice.classList.add("rolling");
    computerDice.classList.add("rolling");

    document.getElementById("result").textContent = "🎲 Rolling...";

    let animation = setInterval(() => {

        createDice(
            Math.floor(Math.random() * 6) + 1,
            playerDice
        );

        createDice(
            Math.floor(Math.random() * 6) + 1,
            computerDice
        );

    }, 100);

    setTimeout(() => {

        clearInterval(animation);

        playerDice.classList.remove("rolling");
        computerDice.classList.remove("rolling");

        const playerRoll = Math.floor(Math.random() * 6) + 1;
        const computerRoll = Math.floor(Math.random() * 6) + 1;

        createDice(playerRoll, playerDice);
        createDice(computerRoll, computerDice);

        round++;

        if (playerRoll > computerRoll) {

            playerScore++;

            document.getElementById("result").textContent =
                `🎉 You Win! ${playerRoll} beats ${computerRoll}`;

        } else if (computerRoll > playerRoll) {

            computerScore++;

            document.getElementById("result").textContent =
                `🤖 Computer Wins! ${computerRoll} beats ${playerRoll}`;

        } else {

            document.getElementById("result").textContent =
                `🤝 Draw! Both rolled ${playerRoll}`;

        }

        document.getElementById("playerScore").textContent = playerScore;
        document.getElementById("computerScore").textContent = computerScore;

        addHistory(playerRoll, computerRoll);

        button.disabled = false;

    }, 1000);
}


function addHistory(player, computer) {

    const history = document.getElementById("historyList");

    const item = document.createElement("div");

    item.className = "history-item";

    let winner;

    if (player > computer) {
        winner = "🏆 You";
    } else if (computer > player) {
        winner = "🤖 Computer";
    } else {
        winner = "🤝 Draw";
    }

    item.innerHTML = `
        <span>Round ${round}</span>
        <span>You ${player} : ${computer} Computer</span>
        <strong>${winner}</strong>
    `;

    history.prepend(item);
}


function resetGame() {

    playerScore = 0;
    computerScore = 0;
    round = 0;

    document.getElementById("playerScore").textContent = "0";
    document.getElementById("computerScore").textContent = "0";

    document.getElementById("result").textContent =
        "Ready? Roll the dice!";

    document.getElementById("historyList").innerHTML = "";

    createDice(1, document.getElementById("playerDice"));
    createDice(1, document.getElementById("computerDice"));
}

</script>

</body>
</html>
